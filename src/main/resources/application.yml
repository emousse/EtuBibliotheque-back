spring:
  application:
    name: etudiant-backend
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}

logging:
  level:
    org:
      hibernate:
        type: info
      springframework:
        web:
          filter:
            CommonsRequestLoggingFilter: info
    com:
      openclassrooms:
        etudiant: info

jwt:
  # Clé HMAC encodée en base64 (256 bits minimum pour HS256).
  # Valeur de développement uniquement : en production, définir la variable JWT_SECRET.
  secret: ${JWT_SECRET:4Cl6pC1OPRgV8CLlHWLthMiEUk5im6gpS6i5LZvJp9Y=}
  # Durée de validité du token en millisecondes (1 heure par défaut).
  expiration: ${JWT_EXPIRATION:3600000}

management:
  endpoints:
    web:
      exposure:
        include: '*'